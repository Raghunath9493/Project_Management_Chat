<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="/static/css/chat.css">
</head>

<body>
    <div class="chat-container">
        <div class="chat-sidebar" id="chat-sidebar">
            <input type="text" id="search-box" placeholder="Search..." />
            <button id="search-user-button">Search</button>
            <ul id="user-list">
                <!-- Dynamically filled with user list -->
            </ul>
        </div>

        <div class="chat-main">
            <div id="chat-messages">
                <!-- Display chat messages here -->
            </div>

            <div class="chat-input">
                <input type="text" id="message-box" placeholder="Type a message" />
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const userList = document.getElementById('user-list');
        const chatMessages = document.getElementById('chat-messages');
        const searchUserButton = document.getElementById('search-user-button');
        const userSearchInput = document.getElementById('search-box');
        const chatSidebar = document.getElementById('chat-sidebar'); // Sidebar reference
        const loggedInUserEmail = session['email'];
        let currentChatEmail = '';

        // Fetch messages when the page loads
        fetch(`/api/get_messages?email=${encodeURIComponent(loggedInUserEmail)}`)
            .then(response => response.json())
            .then(messages => {
                messages.forEach(message => {
                    chatMessages.innerHTML += `<p><strong>${message.sender}:</strong> ${message.content}</p>`;
                });
            })
            .catch(error => console.error('Error fetching messages:', error));

        // Search for users
        searchUserButton.addEventListener('click', function () {
            const query = userSearchInput.value.trim();
            fetch(`/api/search_users?query=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(users => {
                    userList.innerHTML = ''; // Clear previous results
                    if (users.length > 0) {
                        users.forEach(user => {
                            const userElement = document.createElement('div');
                            userElement.textContent = user.nickname; // Assuming each user has a 'nickname' property
                            userElement.dataset.email = user.email; // Store email for click event
                            userElement.addEventListener('click', function () {
                                addChat(user.email); // Add chat on click
                                userSearchInput.value = ''; // Clear search box
                                userList.style.display = 'none'; // Hide user list after selection
                            });
                            userList.appendChild(userElement);
                        });
                        userList.style.display = 'block'; // Show the user list
                    } else {
                        userList.style.display = 'none'; // Hide if no users found
                    }
                });
        });

        // Sending messages
        document.getElementById('send-btn').addEventListener('click', function () {
            const message = document.getElementById('message-box').value;
            if (message && currentChatEmail) {
                fetch('/api/send_message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: loggedInUserEmail, recipient: currentChatEmail, message: message })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        chatMessages.innerHTML += `<p>You: ${message}</p>`; // Display sent message
                        document.getElementById('message-box').value = ''; // Clear input
                    } else {
                        console.error(data.error);
                    }
                })
                .catch(error => console.error('Error sending message:', error));
            }
        });

        function addChat(email) {
            // Create a new chat user element
            const chatUserElement = document.createElement('li');
            chatUserElement.textContent = email; // You can change this to user nickname if available
            chatUserElement.dataset.email = email; // Store email for future reference

            // Append the user to the sidebar
            const chatSidebarList = document.createElement('ul'); // Create a new list to show active chats
            chatSidebar.appendChild(chatUserElement); // Append the user element to the sidebar
            chatUserElement.addEventListener('click', function () {
                // Load messages or start chat with this user
                chatMessages.innerHTML += `<p>Chat with: ${email}</p>`; // Display chat header or similar
            });

            // Optional: Call API to add the chat on the server
            fetch('/api/add_chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            })
            .then(response => response.json())
            .then(data => {
                if (!data.message) {
                    console.error(data.error);
                }
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>

</html>
