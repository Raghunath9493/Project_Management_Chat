<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="/static/css/chat.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <img src="/static/images/wallet.png" alt="Personal Budget Logo">
                <h1>Personal Budget</h1>
            </div>
            <ul class="nav-items">
                <li><a href="{{ url_for('dashboard') }}">Budget Summary</a></li>
                <li><a href="{{ url_for('budget_form') }}">Budget Form</a></li>
                <li><a href="{{ url_for('transactions') }}">Transactions</a></li>
                <li><a href="{{ url_for('profile') }}">Profile</a></li>
                <li><a href="{{ url_for('chats') }}" class="active">Chats</a></li>
            </ul>
        </div>

        <div class="content">
            <div class="header">
                <button id="sidebar-menu-button"><span class="menu-icon">☰</span></button>
                <h2>Messages</h2>
                <div class="logout-button">
                    <span id="user-nickname"></span>
                    <button id="logout-btn">Logout</button>
                </div>
            </div>

            <div class="chat-container">
                <div class="chat-sidebar" id="chat-sidebar">
                    <input type="text" id="user-search-input" placeholder="Search users..." />
                    <button id="search-user-button">Search</button>
                    <div id="search-results">
                        <!-- Dynamically filled with search results -->
                    </div>
                    <ul id="user-list">
                        <!-- Permanent list of messaged users -->
                    </ul>
                </div>

                <div class="chat-main">
                    <div id="chat-messages">
                    </div>


                    <div class="chat-input">
                        <input type="text" id="message-box" placeholder="Type a message" />
                        <button id="send-btn">Send</button>
                    </div>
                </div>
            </div>

            <script>
                document.getElementById('sidebar-menu-button').addEventListener('click', function () {
                    const sidebar = document.querySelector('.sidebar');
                    const content = document.querySelector('.content');

                    sidebar.classList.toggle('active');
                    content.classList.toggle('active');
                });

                // JavaScript for deleting messages
                function deleteMessage(button) {
                    const message = button.parentElement;
                    if (confirm("Are you sure you want to delete this message?")) {
                        message.remove();
                    }
                }
            </script>

            <script>
                const userList = document.getElementById('user-list');
                const searchResults = document.getElementById('search-results');
                const chatMessages = document.getElementById('chat-messages');
                const searchUserButton = document.getElementById('search-user-button');
                const userSearchInput = document.getElementById('user-search-input');
                const chatSidebar = document.getElementById('chat-sidebar');

                const loggedInUserEmail = "{{ session['email'] }}";
                let currentChatEmail = '';
                let messagedUsers = new Set(); // Use a Set to store unique messaged users

                // Function to add a user to the permanent sidebar list
                /*function addUserToSidebar(email) {
                    if (!messagedUsers.has(email)) {
                        messagedUsers.add(email);

                        const userElement = document.createElement('li');
                        userElement.textContent = email;
                        userElement.dataset.email = email;

                        // Make each user clickable to open their chat
                        userElement.addEventListener('click', function () {
                            currentChatEmail = email;
                            chatMessages.innerHTML += `<p>Chat with: ${email}</p>`; // Display chat header
                            loadMessages(email); // Load messages with this user
                        });

                        // Append the user to the permanent sidebar list
                        userList.appendChild(userElement);

                        // Save the user on the server as a "messaged user"
                        fetch('/api/add_chat', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                email
                            })
                        })
                            .then(response => response.json())
                            .then(data => {
                                if (!data.message) {
                                    console.error(data.error);
                                }
                            })
                            .catch(error => console.error('Error:', error));
                    }
                }*/

                // Search for users when typing in the search input with debounce
                let debounceTimer;
                userSearchInput.addEventListener('input', function () {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => {
                        const query = userSearchInput.value.trim();
                        if (query) {
                            fetch(`/api/search_users?query=${encodeURIComponent(query)}`)
                                .then(response => response.json())
                                .then(users => {
                                    searchResults.innerHTML = ''; // Clear previous search results
                                    if (users.length > 0) {
                                        users.forEach(user => {
                                            const userElement = document.createElement('div');
                                            userElement.textContent = user.nickname;
                                            userElement.addEventListener('click', function () {
                                                userSearchInput.value = ''; // Clear search input
                                                currentChatEmail = user.email; // Set the selected user's email for chat
                                                searchResults.style.display = 'none'; // Hide search results

                                                // Add the selected user to the permanent list
                                                addUserToSidebar(user.email);
                                            });
                                            searchResults.appendChild(userElement);
                                        });
                                        searchResults.style.display = 'block'; // Show search results if matches found
                                    } else {
                                        searchResults.style.display = 'none';
                                    }
                                })
                                .catch(error => console.error('Error fetching users:', error));
                        } else {
                            searchResults.style.display = 'none'; // Hide if no input
                        }
                    }, 300); // Debounce timer
                });

                function loadMessages(email) {
                    fetch(`/api/get_messages?sender=${encodeURIComponent(loggedInUserEmail)}&recipient=${encodeURIComponent(email)}`)
                        .then(response => {
                            if (response.ok) {
                                return response.json();
                            } else {
                                throw new Error('Failed to retrieve messages');
                            }
                        })
                        .then(messages => {
                            chatMessages.innerHTML = ''; // Clear previous messages to prevent duplicates

                            messages.forEach(message => {
                                const messageElement = document.createElement('div');
                                messageElement.classList.add('message');

                                if (message.sender === loggedInUserEmail) {
                                    messageElement.classList.add('sent'); // Align sent messages
                                    messageElement.innerHTML = `
                                        <p><strong>You:</strong> ${message.content}</p>
                                        <button class="delete-btn" data-id="${message._id}">Delete</button>
                                    `;
                                } else {
                                    messageElement.classList.add('received'); // Align received messages
                                    messageElement.innerHTML = `<p><strong>${message.sender}:</strong> ${message.content}</p>`;
                                }

                                chatMessages.appendChild(messageElement);
                            });

                            // Attach delete functionality to the delete buttons
                            document.querySelectorAll('.delete-btn').forEach(button => {
                                button.addEventListener('click', function () {
                                    const messageId = this.getAttribute('data-id');
                                    deleteMessage(messageId);
                                });
                            });

                            chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll to the latest message
                        })
                        .catch(error => console.error('Error loading messages:', error));
                }

                function deleteMessage(messageId) {
                    console.log(`Attempting to delete message with ID: ${messageId}`); // Debug log

                    if (confirm("Are you sure you want to delete this message?")) {
                        fetch(`/api/delete_message`, {
                            method: 'DELETE',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ id: messageId }),
                        })
                            .then(response => {
                                if (response.ok) {
                                    // Remove the message from the UI
                                    document.querySelector(`button[data-id="${messageId}"]`).parentElement.remove();
                                } else {
                                    throw new Error('Failed to delete the message');
                                }
                            })
                            .catch(error => console.error('Error deleting message:', error));
                    }
                }



                // Sending messages
                document.getElementById('send-btn').addEventListener('click', function () {
                    const messageBox = document.getElementById('message-box');
                    const message = messageBox.value.trim(); // Trim whitespace from the input
                    const chatMessages = document.getElementById('chat-messages'); // Assuming a chat messages container

                    if (message && currentChatEmail) {
                        fetch('/api/send_message', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                sender: loggedInUserEmail,
                                recipient: currentChatEmail,
                                message
                            })
                        })
                            .then(response => {
                                if (response.ok) {
                                    // Message sent successfully
                                    return response.json();
                                } else if (response.status === 403) {
                                    // Message contains prohibited content
                                    alert("Your message contains prohibited content and was not sent.");
                                    messageBox.value = ''; // Clear the input field
                                    throw new Error('Prohibited content detected');
                                } else {
                                    throw new Error('An error occurred while sending the message');
                                }
                            })
                            .then(data => {
                                if (data.message) {
                                    // Create a message element for the UI
                                    const messageElement = document.createElement('div');
                                    messageElement.classList.add('message', 'sent'); // Align sent messages to the right
                                    messageElement.innerHTML = `<p><strong>You:</strong> ${message}</p>`;

                                    // Append the message to the chat container
                                    chatMessages.appendChild(messageElement);

                                    // Clear the input field and auto-scroll to the bottom
                                    messageBox.value = '';
                                    chatMessages.scrollTop = chatMessages.scrollHeight; // Scroll to the latest message
                                }
                            })
                            .catch(error => console.error('Error:', error));
                    } else if (!message) {
                        alert("Please enter a valid message."); // Notify user if the message is empty
                    }
                });



                const typingIndicator = document.createElement('p');
                typingIndicator.textContent = '';
                typingIndicator.id = 'typing-indicator';
                chatMessages.appendChild(typingIndicator);

                let typingTimeout;
                const typingDelay = 1000; // 1 second

                document.getElementById('message-box').addEventListener('input', () => {
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => {
                        fetch('/api/typing', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                sender: loggedInUserEmail,
                                recipient: currentChatEmail
                            })
                        });
                    }, typingDelay);
                });

                $(document).ready(function () {
                    $('#logout-btn').click(function () {
                        $.get('/logout', function (response) {
                            alert(response.message);
                            window.location.href = '/';
                        }).fail(function () {
                            alert('Logout failed. Please try again.');
                        });
                    });
                });

                // Function to load the permanent list of users from the server
                function loadMessagedUsers() {
                    fetch('/api/get_messaged_users', {
                        method: 'GET',
                        headers: { 'Content-Type': 'application/json' },
                    })
                        .then(response => response.json())
                        .then(users => {
                            userList.innerHTML = ''; // Clear existing list

                            users.forEach(user => {
                                addUserToSidebar(user.email); // Add each user to the sidebar
                            });
                        })
                        .catch(error => console.error('Error loading messaged users:', error));
                }


                function addUserToSidebar(email) {
                    if (!messagedUsers.has(email)) {
                        messagedUsers.add(email);

                        const userElement = document.createElement('li');
                        userElement.textContent = email;
                        userElement.dataset.email = email;

                        // Make each user clickable to open their chat
                        userElement.addEventListener('click', function () {
                            currentChatEmail = email;
                            chatMessages.innerHTML = `<p>Chat with: ${email}</p>`; // Display chat header
                            loadMessages(email); // Load messages with this user
                        });

                        // Append the user to the sidebar
                        userList.appendChild(userElement);

                        // Save the user on the server
                        fetch('/api/add_chat', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ email }),
                        })
                            .then(response => response.json())
                            .then(data => {
                                if (!data.success) {
                                    console.error('Error saving user:', data.error);
                                }
                            })
                            .catch(error => console.error('Error:', error));
                    }
                }


                // Call this function to load the list of users when the page loads
                document.addEventListener('DOMContentLoaded', function () {
                    loadMessagedUsers(); // Fetch and display messaged users
                });
            </script>

</body>

</html>
