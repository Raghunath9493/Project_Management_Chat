<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="/static/css/chat.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>

<body>
    <div class="chat-container">
        <div class="chat-sidebar" id="chat-sidebar">
            <input type="text" id="user-search-input" placeholder="Search users..." />
            <button id="search-user-button">Search</button>
            <div id="search-results">
                <!-- Dynamically filled with search results -->
            </div>
            <ul id="user-list">
                <!-- Permanent list of messaged users -->
            </ul>
        </div>

        <div class="chat-main">
            <div id="chat-messages">
                <!-- Display chat messages here -->
            </div>

            <div class="chat-input">
                <input type="text" id="message-box" placeholder="Type a message" />
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const userList = document.getElementById('user-list');
        const searchResults = document.getElementById('search-results');
        const chatMessages = document.getElementById('chat-messages');
        const searchUserButton = document.getElementById('search-user-button');
        const userSearchInput = document.getElementById('user-search-input');
        const chatSidebar = document.getElementById('chat-sidebar');
        
        const loggedInUserEmail = "{{ session['email'] }}";
        let currentChatEmail = '';
        let messagedUsers = new Set(); // Use a Set to store unique messaged users
    
        // Function to add a user to the permanent sidebar list
        function addUserToSidebar(email) {
            if (!messagedUsers.has(email)) {
                messagedUsers.add(email);
    
                const userElement = document.createElement('li');
                userElement.textContent = email;
                userElement.dataset.email = email;
    
                // Make each user clickable to open their chat
                userElement.addEventListener('click', function () {
                    currentChatEmail = email;
                    chatMessages.innerHTML += `<p>Chat with: ${email}</p>`; // Display chat header
                    loadMessages(email); // Load messages with this user
                });
    
                // Append the user to the permanent sidebar list
                userList.appendChild(userElement);
    
                // Save the user on the server as a "messaged user"
                fetch('/api/add_chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                })
                .then(response => response.json())
                .then(data => {
                    if (!data.message) {
                        console.error(data.error);
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        }
    
        // Search for users when typing in the search input with debounce
        let debounceTimer;
        userSearchInput.addEventListener('input', function () {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                const query = userSearchInput.value.trim();
                if (query) {
                    fetch(`/api/search_users?query=${encodeURIComponent(query)}`)
                        .then(response => response.json())
                        .then(users => {
                            searchResults.innerHTML = ''; // Clear previous search results
                            if (users.length > 0) {
                                users.forEach(user => {
                                    const userElement = document.createElement('div');
                                    userElement.textContent = user.nickname;
                                    userElement.addEventListener('click', function () {
                                        userSearchInput.value = ''; // Clear search input
                                        currentChatEmail = user.email; // Set the selected user's email for chat
                                        searchResults.style.display = 'none'; // Hide search results

                                        // Add the selected user to the permanent list
                                        addUserToSidebar(user.email);
                                    });
                                    searchResults.appendChild(userElement);
                                });
                                searchResults.style.display = 'block'; // Show search results if matches found
                            } else {
                                searchResults.style.display = 'none';
                            }
                        })
                        .catch(error => console.error('Error fetching users:', error));
                } else {
                    searchResults.style.display = 'none'; // Hide if no input
                }
            }, 300); // Debounce timer
        });
    
        function loadMessages(email) {
            fetch(`/api/get_messages?sender=${encodeURIComponent(loggedInUserEmail)}&recipient=${encodeURIComponent(email)}`)
                .then(response => response.json())
                .then(messages => {
                    chatMessages.innerHTML = ''; // Clear previous messages
                    messages.forEach(message => {
                        chatMessages.innerHTML += `<p><strong>${message.sender}:</strong> ${message.content}</p>`;
                    });
                })
                .catch(error => console.error('Error fetching messages:', error));
        }

    
        // Sending messages
        document.getElementById('send-btn').addEventListener('click', function () {
            const message = document.getElementById('message-box').value;
            if (message && currentChatEmail) {
                fetch('/api/send_message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: loggedInUserEmail, recipient: currentChatEmail, message })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.message) {
                            chatMessages.innerHTML += `<p>You: ${message}</p>`;
                            document.getElementById('message-box').value = ''; // Clear input field
                        } else {
                            console.error(data.error);
                        }
                    })
                    .catch(error => console.error('Error sending message:', error));
            }
        });
    </script>
    
</body>
</html>
